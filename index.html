<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .main{

        }
     
       .calculator{
           width: 300px;
           height: 530px;
           border: 1px solid ;
           margin: 20px auto;
           background: black;
           color: aliceblue;
          
        }
        @keyframes move{
          from{
             
          }
          to{
            
          }
        }
        .screen{
            height: 70px;
            width: 90%;
            background: rgb(104, 103, 103);
            font-size: 48px;
            margin: 10px auto;
            overflow:hidden;
        }
        .buttons{
            display: flex;
            flex-wrap: wrap;
            gap: 10px ;
            justify-content: center;
            padding: 20px 0px;
            
        }
        .buttons button{
            display: block;
             width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            font-size: large;
            cursor: pointer;
            
            
        }
        .b2{
            background: lightslategray;
        }
        .a1{
            background: orange;
            color: white;
        }
       .equal{
        background: orange;
        color: aliceblue;
       }
       .equal:hover{
        background: white;
        color: black;
       }
       .btn{
        border-radius: 50%;
       /* background: black;
        color: aliceblue; */
       
       }
       .btn:hover{
        border-radius: 30%;
          /*background: white; */
        /* color: black; */
        font-size: 40px;
       
       }
      .text{
        font-size: 23px;
        height: 30px;
        width: 80%;
        background:url(./giphy\ \(1\).gif);
        margin: 10px auto;
        text-align: center;
        color: black;
        border-radius: 25%;
        background-clip: text;
        color: transparent;
      }
       
    
      
    </style>
</head>
<body>
    
    <div class="calculator">
      <div class="text">Wellcome to calculator</div>
       <div class="screen"></div>
       <div class="buttons">
          <button class="b2" onclick="Clear()">AC</button>
          <button class="b2" onclick="Delete()">Del</button>
          <button class="b2" onclick="Add('%')">%</button>
          <button class="a1" onclick="Add('/')">/</button>

          <button class="btn" onclick="Add(7)">7</button>
         <button class="btn" onclick="Add(8)">8</button>
         <button class="btn" onclick="Add(9)">9</button>
         <button class="a1" onclick="Add('*')">*</button>

        
         <button class="btn" onclick="Add(4)">4</button>
         <button class="btn" onclick="Add(5)">5</button>
         <button class="btn" onclick="Add(6)">6</button>
         <button class="a1" onclick="Add('-')">-</button>

         <button class="btn" onclick="Add(1)">1</button>
         <button class="btn" onclick="Add(2)">2</button>
         <button class="btn" onclick="Add(3)">3</button>
         <button class="a1" onclick="Add('+')">+</button> 

         <button class="btn" onclick="Add(0)">0</button>
        <button class="btn" onclick="Add('00')">00</button>
        <button class="btn" onclick="Add('.')">.</button>
        <button class="equal" onclick="calulate()">=</button>
        </div>
     </div>
         
    <script>
        var screen = document.querySelector('.screen')
        function Add(a){
            screen.innerText += a
            new Audio('button.mp3')
            .play()
         
        }
        function calulate(){
            screen.innerText=eval(screen.innerText)
        }
        function Clear()
        {
            screen.innerText=''
        }
        function Delete(){
            screen.innerText = screen.innerText.slice(0,-1)
        }
        document.addEventListener('keydown', function(e){
          if(e.key == '1'){
            screen.innerText +=1
            new Audio('button.mp3').play()
           
          }
             if(e.key == '2'){
            screen.innerText +=2
            new Audio('button.mp3').play()
          }
             if(e.key == '3'){
            screen.innerText +=3
            new Audio('button.mp3').play()
          }   if(e.key == '4'){
            screen.innerText +=4
            new Audio('button.mp3').play()
          }  
            if(e.key == '5'){
            screen.innerText +=5
            new Audio('button.mp3').play()
          }   if(e.key == '6'){
            screen.innerText +=6
            new Audio('button.mp3').play()
          }   if(e.key == '7'){
            screen.innerText +=7
            new Audio('button.mp3').play()
          }   if(e.key == '8'){
            screen.innerText +=8
            new Audio('button.mp3').play()
          }   if(e.key == '9'){
            screen.innerText +=9
            new Audio('button.mp3').play()
          }
             if(e.key == '0'){
            screen.innerText +=0
            new Audio('button.mp3').play()
          }  
            if(e.key=='00'){
              screen.innerText +='00'
              new Audio('button.mp3').play()
            }
          if(e.key == '+'){
            screen.innerText +='+'
            new Audio('button.mp3').play()
          }
            if(e.key == '-'){
            screen.innerText +='-'
            new Audio('button.mp3').play()
          }if(e.key == '/'){
            screen.innerText +='/'
            new Audio('button.mp3').play()
          }
          if(e.key == '*'){
            screen.innerText +='*'
            new Audio('button.mp3').play()
          } 
           if(e.key == 'Backspace'){
            screen.innerText =screen.innerText.slice(0 ,-1)
            new Audio('button.mp3').play()
          }
          if(e.key=='Enter'){
            screen.innerText=eval(screen.innerText)
          }
          if(e.key=='%'){
            screen.innerText='%'
          }
           

        })
       
</script>
</body>
</html
